<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MigrationExecutor Dashboard</title>

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">MigrationExecutor</h1>
        <div class="flex items-center space-x-2">
            <i class="bi bi-server text-gray-600 text-2xl"></i>
            <span class="text-gray-600">v1.0</span>
        </div>
    </header>

    <main class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-4 rounded-xl shadow hover:shadow-lg transition">
                <div class="flex items-center space-x-4">
                    <i class="bi bi-play-circle-fill text-blue-500 text-3xl"></i>
                    <h2 class="text-lg font-semibold">Run Migration</h2>
                </div>
                <p class="mt-2 text-gray-500 text-sm">Ejecuta un job de migración desde los paquetes configurados.</p>
                <br />
                <a class="mt-4 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition" href="./api/Migration/run-job-from-folderm">
                    Ejecutar
                </a>
            </div>

            <div class="bg-white p-4 rounded-xl shadow hover:shadow-lg transition">
                <div class="flex items-center space-x-4">
                    <i class="bi bi-heart-pulse-fill text-red-500 text-3xl"></i>
                    <h2 class="text-lg font-semibold">Ping API</h2>
                </div>
                <p class="mt-2 text-gray-500 text-sm">Verifica que la WebAPI esté funcionando correctamente.</p>
                <br />
                <a class="mt-4 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition" href="./api/migration/ping">
                    API Health Check
                </a>
            </div>

            <div class="bg-white p-4 rounded-xl shadow hover:shadow-lg transition">
                <div class="flex items-center space-x-4">
                    <i class="bi bi-journal-text text-green-500 text-3xl"></i>
                    <h2 class="text-lg font-semibold">Ver Documentación</h2>
                </div>
                <p class="mt-2 text-gray-500 text-sm">Accede a la documentacion.</p>
                <br />
                <a class="mt-4 px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition" href="./swagger">
                    Open API Documentation
                </a>
            </div>

        </div>
    </main>

</body>
</html>
